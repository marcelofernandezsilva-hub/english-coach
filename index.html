<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Coach</title>
<meta name="theme-color" content="#3b5bdb">
<meta name="description" content="Tu academia personal de inglés: lecciones, listening, speaking y repaso.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Coach">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#141a2e; --muted:#5d6782; --line:#e3e7f0;
  --brand:#3b5bdb; --brand-2:#e8edff; --ok:#12a36b; --ok-2:#e3f6ee; --bad:#d6334a; --bad-2:#fde8eb;
  --warn:#e8890c; --warn-2:#fff3e0; --sky:#0ea5c6;
  --r:14px; --shadow:0 1px 2px rgba(20,26,46,.06),0 4px 16px rgba(20,26,46,.05);
  --head:"Fraunces",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h1{font:700 30px/1.15 var(--head);letter-spacing:-.01em}
h2{font:700 22px/1.2 var(--head)}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:var(--brand)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:#10162b;color:#c9d1e8;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;gap:10px;align-items:center;padding:4px 10px 18px;color:#fff}
.logo .mk{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5c7cfa,#22b8cf);display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
.logo b{display:block;font:700 17px var(--head);letter-spacing:.01em}
.logo small{display:block;font-size:11px;color:#8d97b5}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;color:#c9d1e8;text-decoration:none;font-size:14.5px;font-weight:500}
.nav a:hover{background:#1b2340;color:#fff}
.nav a.on{background:#25305a;color:#fff}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.side .grow{flex:1}
.savebox{font-size:12px;color:#8d97b5;padding:10px 12px;border-top:1px solid #222b4a}
.savebox .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#8d97b5;vertical-align:middle}
.savebox .dot.ok{background:#3ddc97}.savebox .dot.warn{background:#ffb02e}.savebox .dot.bad{background:#ff5d73}
main{padding:28px clamp(16px,4vw,44px) 90px;max-width:1180px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top .sub{color:var(--muted);margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#c5cce0}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#2f4bc0}
.btn.big{padding:13px 22px;font-size:16px;border-radius:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.nav a:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #91a7ff;outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:13.5px}.tiny{font-size:12px}
.k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .n{font:700 30px/1.1 var(--head);margin-top:6px}
.stat .d{font-size:13px;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--brand-2);color:var(--brand)}
.pill.ok{background:var(--ok-2);color:var(--ok)}.pill.bad{background:var(--bad-2);color:var(--bad)}.pill.warn{background:var(--warn-2);color:#b26200}.pill.gray{background:#eef0f5;color:var(--muted)}
.bar{height:8px;background:#edf0f7;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#5c7cfa,#22b8cf);border-radius:99px}
.hero{background:linear-gradient(120deg,#1b2a6b,#3b5bdb 60%,#22b8cf);color:#fff;border:0}
.hero .muted{color:#d5ddff}
.hero .btn.big{background:#fff;color:#1b2a6b;border-color:#fff}
.lvl{font:700 46px/1 var(--head)}
.skills{display:grid;gap:10px}
.skill{display:grid;grid-template-columns:130px 1fr 54px;gap:12px;align-items:center;font-size:14px}
.q{font-size:18px;font-weight:500;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;cursor:pointer;font-size:15.5px}
.opt:hover{border-color:#a5b4fc;background:#fafbff}
.opt.sel{border-color:var(--brand);background:var(--brand-2)}
.opt.right{border-color:var(--ok);background:var(--ok-2)}
.opt.wrong{border-color:var(--bad);background:var(--bad-2)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14.5px}
.fb.ok{background:var(--ok-2)}.fb.bad{background:var(--bad-2)}.fb.info{background:var(--brand-2)}
textarea,input[type=text],input[type=number],select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:15.5px}
textarea{min-height:160px;resize:vertical}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.steps span{font-size:12.5px;padding:4px 10px;border-radius:99px;background:#eef0f5;color:var(--muted);font-weight:600}
.steps span.on{background:var(--brand);color:#fff}.steps span.done{background:var(--ok-2);color:var(--ok)}
.reading{background:#fbfbfd;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;font-size:15.5px}
.corr{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.corr .o{text-decoration:line-through;color:var(--bad)}
.corr .c{color:var(--ok);font-weight:600}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:#eef0f5;color:var(--muted)}
.tag.g{background:var(--bad-2);color:var(--bad)}.tag.n{background:var(--warn-2);color:#b26200}.tag.v{background:var(--brand-2);color:var(--brand)}
.path{display:grid;gap:14px}
.mod{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.mod>summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center}
.mod>summary::-webkit-details-marker{display:none}
.mod .num{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:700 18px var(--head);background:#eef0f5;color:var(--muted)}
.mod.cur .num{background:var(--brand);color:#fff}.mod.done .num{background:var(--ok);color:#fff}
.unit{padding:4px 18px 16px 76px}
.unit h4{margin:10px 0 8px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.les{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;font-size:14.5px}
.les:hover{background:#f6f7fb}
.les .ic{width:20px;height:20px;border-radius:50%;border:2px solid #cfd5e3;display:grid;place-items:center;font-size:11px;color:#fff}
.les.done .ic{background:var(--ok);border-color:var(--ok)}
.les.avail .ic{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-2)}
.les.review .ic{background:var(--warn);border-color:var(--warn)}
.les.locked{color:#9aa3b8}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:4px 2px 10px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:15px}
.msg.ai{background:#f0f2f8;align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.flash{perspective:1000px;margin:10px auto;max-width:520px}
.face{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-height:220px;padding:28px;display:grid;place-items:center;text-align:center}
.face .term{font:700 32px/1.2 var(--head)}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.spin{width:18px;height:18px;border:2.5px solid #c7d0ea;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#10162b;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw}
.mnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#10162b;z-index:50;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mnav a{color:#c9d1e8;text-decoration:none;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:8px}
  .mnav a.on{color:#fff;background:#25305a}
  .mnav svg{width:20px;height:20px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g4.keep{grid-template-columns:repeat(2,1fr)}
  main{padding:20px 14px 96px}
  h1{font-size:25px}
  .unit{padding:4px 12px 14px 16px}
  .skill{grid-template-columns:100px 1fr 44px}
  .msg{max-width:90%}
  .msave{display:block!important}
}
.msave{display:none;font-size:12px;color:var(--muted);margin-top:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mk">EC</div><div><b>English Coach</b><small>My Personal English Academy</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="grow"></div>
    <div class="savebox" id="savebox"><span class="dot"></span>Cargando…</div>
  </aside>
  <main id="main"><div class="empty"><span class="spin"></span> Cargando tu academia…</div></main>
</div>
<nav class="mnav" id="mnav"></nav>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="platform.js"></script>
<script>
(function(){
"use strict";
/* ============================================================
   UTILIDADES
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const nowISO=()=>new Date().toISOString();
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const LEVELS=["A1","A2","B1","B2","C1","C2"];
const SKILLS=[["grammar","Grammar"],["vocabulary","Vocabulary"],["reading","Reading"],["writing","Writing"],["listening","Listening"],["speaking","Speaking"]];
const SKILL_LABEL=Object.fromEntries(SKILLS.concat([["reading_writing","Reading & Writing"],["assessment","Evaluación"],["professional","Inglés profesional"]]));
const norm=s=>String(s||"").toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"()]/g,"").replace(/\s+/g," ").trim();
const fmtMin=m=>{m=Math.round(m||0);return m<60?m+" min":Math.floor(m/60)+" h "+(m%60)+" min";};
function weekStart(d){d=d?new Date(d):new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10);}
function toast(t,ms){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),ms||3200);}

/* ============================================================
   ESTADO Y PERSISTENCIA
   ============================================================ */
const LS_KEY="english-coach-state-v1";
function blankState(){
  return {v:1,createdAt:nowISO(),updatedAt:nowISO(),
    prefs:{voice:"buttery",rate:1,goalMin:150,goalLessons:3},
    diag:{status:"none",step:"intro"},
    course:null,
    current:null,          // {lessonId, content, step, answers:{}, app:{}, final:{}}
    results:[],            // {date, type, id, skill, score, title}
    errors:[],             // {id,key,skill,kind,prompt,wrong,correct,explanation,count,last,resolved}
    vocab:[],              // SRS cards
    time:{total:0,byDay:{}},
    speaking:[],           // historial de Speaking Lab
    activity:[]            // log breve
  };
}
let S=blankState();
let db=null, me=null, userCap=null, sample=null, tts=null, dict=null, dls=null;
let persistMode="local"; // "account" | "local" | "none"
let saveTimer=null, saving=false, saveAgain=false, lastSaved="";
function loadLocal(){try{const t=localStorage.getItem(LS_KEY);return t?JSON.parse(t):null;}catch(e){return null;}}
function saveLocal(json){try{localStorage.setItem(LS_KEY,json);return true;}catch(e){return false;}}
let statusHTML='<span class="dot"></span>Cargando…';
function setSaveStatus(kind,text){
  const html='<span class="dot '+kind+'"></span>'+esc(text); statusHTML=html;
  const b=$("#savebox"); if(b) b.innerHTML=html;
  document.querySelectorAll(".msave").forEach(el=>el.innerHTML=html);
}
function save(){ S.updatedAt=nowISO(); clearTimeout(saveTimer); saveTimer=setTimeout(flush,700); }
async function flush(){
  const json=JSON.stringify(S);
  if(json===lastSaved) return;
  const okLocal=saveLocal(json);
  if(persistMode!=="account"||!db||!me){
    lastSaved=json;
    setSaveStatus(okLocal?"ok":"bad", okLocal?"Progreso guardado en este computador":"No se pudo guardar");
    return;
  }
  if(saving){saveAgain=true;return;}
  saving=true; setSaveStatus("warn","Guardando…");
  try{
    await db.doc("data/users/"+me+"/state").set(JSON.parse(json));
    lastSaved=json; setSaveStatus("ok","Progreso guardado en tu cuenta");
  }catch(e){
    if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800));
      try{await db.doc("data/users/"+me+"/state").set(JSON.parse(json));lastSaved=json;setSaveStatus("ok","Progreso guardado en tu cuenta");}
      catch(e2){setSaveStatus("bad","Error al guardar en la cuenta (copia local OK)");} }
    else if(e&&e.code==="quota_exceeded"){setSaveStatus("bad","Base de datos llena: exporta tu progreso");}
    else setSaveStatus("bad","Error al guardar en la cuenta (copia local OK)");
  }
  saving=false;
  if(saveAgain){saveAgain=false;flush();}
}
function migrate(o){const b=blankState();if(!o||typeof o!=="object")return b;
  for(const k in b) if(!(k in o)) o[k]=b[k];
  o.prefs=Object.assign(b.prefs,o.prefs||{});o.time=Object.assign(b.time,o.time||{});return o;}
function log(t){S.activity.unshift({d:nowISO(),t});S.activity=S.activity.slice(0,40);}

/* tiempo de estudio: cuenta minutos con la pestaña visible y actividad reciente */
let lastAct=Date.now(), pendingSec=0;
["click","keydown","scroll","touchstart"].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now();},{passive:true}));
setInterval(()=>{ if(document.visibilityState==="visible"&&Date.now()-lastAct<120000){pendingSec+=15;}
  if(pendingSec>=120){const m=pendingSec/60;pendingSec=0;S.time.total=(S.time.total||0)+m;const d=today();S.time.byDay[d]=(S.time.byDay[d]||0)+m;save();}
},15000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&pendingSec>=30){const m=pendingSec/60;pendingSec=0;S.time.total+=m;const d=today();S.time.byDay[d]=(S.time.byDay[d]||0)+m;S.updatedAt=nowISO();flush();} });

/* ============================================================
   CLAUDE (capacidad sample)
   ============================================================ */
async function askJSON(prompt,tier){
  if(!sample) throw {code:"no_sample",message:"Configura tu clave gratuita de Gemini en Ajustes para usar la IA."};
  const opts={modelTier:tier||"default",cache:false};
  try{
    if(sample.json) return await sample.json(prompt,opts);
    const r=await sample(prompt,opts); return parseJSON(r.text);
  }catch(e){
    if(e&&e.code==="not_granted") throw {code:"not_granted",message:"La clave de Gemini no es válida. Revísala en Ajustes."};
    if(e&&e.code==="rate_limited") throw {code:"rate_limited",message:"Demasiadas solicitudes seguidas. Espera un minuto y vuelve a intentar."};
    if(e&&e.text){try{return parseJSON(e.text);}catch(_){}}
    throw {code:(e&&e.code)||"error",message:(e&&e.message)||"No se pudo obtener respuesta de la IA."};
  }
}
function parseJSON(t){t=String(t||"");const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<0)throw new Error("sin JSON");return JSON.parse(t.slice(a,b+1));}
async function askText(messages,onText){
  if(!sample) throw {code:"no_sample",message:"No disponible"};
  const r=await sample(messages,{modelTier:"default",cache:false,onText:onText?({text})=>onText(text):undefined});
  return r.text;
}
const LEARNER="Learner profile: Chilean professional, native Spanish speaker, uses English with international colleagues and suppliers (meetings, emails, negotiations, presentations). Wants fluency, US English listening, complex ideas, professional + everyday vocabulary, pronunciation/intelligibility, grammar in real conversation, confidence in meetings, natural social conversation, travel and culture.";

/* ============================================================
   AUDIO: TTS (listening) y DICTADO (speaking)
   ============================================================ */
async function speak(text,opts){
  if(!tts) throw {code:"no_tts"};
  return tts.speak(text,Object.assign({language:"en",voice:S.prefs.voice||"",rate:S.prefs.rate||1},opts||{}));
}
function stopSpeak(){try{tts&&tts.stop();}catch(e){}}
let dictState={on:false,target:null,base:"",started:0,partial:""};
let micDenied=false;
function startDictation(textarea,btn){
  if(!dict){ toast(MIC_MISSING); return; }
  if(dictState.on){ stopDictation(); return; }
  stopSpeak();
  dictState={on:true,target:textarea,base:textarea.value?textarea.value.trim()+" ":"",started:Date.now(),partial:"",btn};
  btn.classList.add("on"); btn.innerHTML=ICON.mic+" Detener";
  dict.start().catch(e=>{ dictState.on=false; btn.classList.remove("on"); btn.innerHTML=ICON.mic+" Hablar";
    if(e&&e.code==="not_granted"){micDenied=true;toast("No hay permiso para usar el micrófono. Actívalo en la configuración del navegador y recarga la página.",6000);dict=null;}
    else if(e&&e.code==="dismissed") toast("Se cerró la solicitud de micrófono. Pulsa «Hablar» de nuevo para permitirlo.");
    else toast("No se pudo iniciar el micrófono: "+((e&&(e.message||e.code))||"error desconocido")); });
}
async function stopDictation(){
  if(!dictState.on) return;
  try{await dict.stop();}catch(e){}
  finishDict();
}
function finishDict(){
  const b=dictState.btn; dictState.on=false;
  if(b){b.classList.remove("on");b.innerHTML=ICON.mic+" Hablar";}
  if(dictState.target){dictState.target.dataset.seconds=String(Math.round((Date.now()-dictState.started)/1000)+(+dictState.target.dataset.seconds||0));dictState.target.dataset.voice="1";dictState.target.dispatchEvent(new Event("input"));}
}
const MIC_MISSING="El reconocimiento de voz no está disponible en este navegador. Usa la app instalada desde Google Chrome o Safari (Mac), o Chrome en Android.";

const LETTERS=["A","B","C","D","E","F"];
const ORD={first:0,second:1,third:2,fourth:3,one:0,two:1,three:2,four:3,primera:0,segunda:1,tercera:2,cuarta:3,uno:0,dos:1,tres:2,cuatro:3};
const STOP=new Set("a an the to of in on at for and or is are was were be it its this that with by as from i you he she we they".split(" "));
const NUMW={zero:"0",one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10",eleven:"11",twelve:"12",fifteen:"15",twenty:"20",thirty:"30",forty:"40",fifty:"50",hundred:"100"};
const numify=s=>s.split(" ").map(w=>NUMW[w]||w).join(" ");
function matchOption(spoken,options){
  const s=norm(spoken); if(!s) return -1;
  const words=s.split(" ");
  // letra: "a", "b", "option c", "letter d", "answer b", "la b"
  const lm=s.match(/^(?:option|letter|answer|la|letra|opcion|opción)?\s*([a-f])$/);
  if(lm){const i=LETTERS.indexOf(lm[1].toUpperCase()); if(i<options.length) return i;}
  // 1) coincidencia con el texto de cada opción (prioridad)
  const sw=new Set(numify(s).split(" ").filter(w=>!STOP.has(w)));
  let best=-1,bs=0,second=0;
  options.forEach((o,i)=>{const ow=numify(norm(o)).split(" ").filter(w=>w&&!STOP.has(w));if(!ow.length)return;
    const hit=ow.filter(w=>sw.has(w)||[...sw].some(x=>x.length>3&&w.length>3&&(x.startsWith(w.slice(0,4))))).length;
    const sc=hit/ow.length; if(sc>bs){second=bs;bs=sc;best=i;} else if(sc>second) second=sc;});
  if(bs>=0.5&&bs-second>=0.2) return best;
  // 2) ordinal dicho por sí solo: "the third one", "number two", "la segunda"
  const om=s.match(/^(?:the |la |el |number |option |opcion |opción )?(first|second|third|fourth|one|two|three|four|primera|segunda|tercera|cuarta|uno|dos|tres|cuatro)(?: one| opcion| opción)?$/);
  if(om&&ORD[om[1]]<options.length) return ORD[om[1]];
  return -1;
}
/* Agrega "Responder hablando" a un grupo de opciones. buttons: NodeList de .opt con data-i; texts: textos por data-i */
function voiceAnswer(host,buttons,texts){
  if(!dict){ host.insertAdjacentHTML("beforeend",micNote()); return; }
  const id="v"+uid();
  host.insertAdjacentHTML("beforeend",'<div class="row" style="margin-top:10px;gap:10px"><button class="btn" id="'+id+'">'+ICON.mic+' Hablar</button><span class="small muted" id="'+id+'s">También puedes responder en voz alta: di la opción (o su letra).</span></div><textarea id="'+id+'t" hidden></textarea>');
  const btn=document.getElementById(id), ta=document.getElementById(id+"t"), out=document.getElementById(id+"s");
  btn.onclick=()=>{ ta.value=""; ta.dataset.voice=""; out.textContent="Escuchando… di tu respuesta y pulsa «Detener»."; startDictation(ta,btn); };
  ta.addEventListener("input",()=>{ if(dictState.on||ta.dataset.voice!=="1") return; ta.dataset.voice="";
    const heard=ta.value.trim(); if(!heard){out.textContent="No te escuché. Pulsa «Hablar» e inténtalo de nuevo.";return;}
    const opts=[...buttons].map(b=>texts[+b.dataset.i]);
    const k=matchOption(heard,opts);
    if(k<0){out.innerHTML='Escuché: «'+esc(heard)+'». No coincide claramente con una opción; repite o di la letra (A, B, C…).';return;}
    out.innerHTML='Escuché: «'+esc(heard)+'» → opción '+LETTERS[k];
    buttons[k].click(); });
}
function wireDictation(){
  if(!dict) return;
  dict.onPartial&&dict.onPartial(({text})=>{ if(!dictState.on||!dictState.target)return; dictState.partial=text; dictState.target.value=dictState.base+text; });
  dict.onFinal&&dict.onFinal(({text})=>{ if(!dictState.target)return; dictState.base=dictState.base+text+" "; dictState.partial=""; dictState.target.value=dictState.base; });
  dict.onState&&dict.onState(({state})=>{ if(state==="idle"&&dictState.on) finishDict(); });
}

  const rs=S.results.filter(r=>r.skill===skill||(skill==="reading"&&r.skill==="reading_writing")||(skill==="writing"&&r.skill==="reading_writing")).slice(-5);

/* ============================================================
   GRÁFICOS SVG
   ============================================================ */
function lineChart(series,labels,maxY){
  const W=560,H=200,pl=34,pr=10,pt=10,pb=26,n=labels.length;
  const x=i=>pl+(n<=1?0:i*(W-pl-pr)/(n-1)), y=v=>pt+(1-v/maxY)*(H-pt-pb);
  let g='';
  [0,25,50,75,100].forEach(t=>{const yy=y(t*maxY/100);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="#edf0f7"/><text x="'+(pl-6)+'" y="'+(yy+4)+'" font-size="10" fill="#8d97b5" text-anchor="end">'+Math.round(t*maxY/100)+'</text>';});
  const step=Math.ceil(n/8);labels.forEach((l,i)=>{if(i%step===0)g+='<text x="'+x(i)+'" y="'+(H-8)+'" font-size="10" fill="#8d97b5" text-anchor="middle">'+esc(l)+'</text>';});
  series.forEach(s=>{const pts=s.pts.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)return;
    g+='<polyline fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(p=>p.join(",")).join(" ")+'"/>';
    pts.forEach(p=>g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="#fff" stroke="'+s.color+'" stroke-width="2"/>');});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de evolución">'+g+'</svg>'+(series.length>1?'<div class="legend">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>').join("")+'</div>':'');
}
function barChart(items,maxV,unit,color){
  if(!items.length) return '<p class="muted small">Sin datos todavía.</p>';
  const W=460,rowH=28,H=items.length*rowH+6,pl=150;
  let g='';items.forEach((it,i)=>{const w=maxV?(it.v/maxV)*(W-pl-60):0;const yy=i*rowH+4;
    g+='<text x="'+(pl-8)+'" y="'+(yy+15)+'" font-size="13" fill="#5d6782" text-anchor="end">'+esc(it.k.length>22?it.k.slice(0,21)+"…":it.k)+'</text>'+
       '<rect x="'+pl+'" y="'+(yy+3)+'" width="'+Math.max(2,w)+'" height="16" rx="5" fill="'+(it.c||color||"#3b5bdb")+'"/>'+
       '<text x="'+(pl+Math.max(2,w)+6)+'" y="'+(yy+15)+'" font-size="12" fill="#141a2e" font-weight="600">'+Math.round(it.v)+(unit||"")+'</text>';});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
}

function pickItem(level,asked){const used=new Set(asked.map(a=>a.id));
  for(let dl=0;dl<6;dl++){for(const L of [level+dl,level-dl]){const it=GBANK.find(x=>x.l===L&&!used.has(x.id));if(it)return it;}}return null;}
function shuffleOpts(it,seed){const idx=it.o.map((_,i)=>i);let s=0;for(const ch of (seed||it.id))s=(s*31+ch.charCodeAt(0))>>>0;for(let i=idx.length-1;i>0;i--){s=(s*1103515245+12345)>>>0;const j=s%(i+1);[idx[i],idx[j]]=[idx[j],idx[i]];}return idx;}
function dGrammar(c){
  const g=S.diag.g;

  if(!g.cur){const it=pickItem(g.idx,g.asked);if(!it){dNext("reading");return;}g.cur=it.id;save();}
  const it=GBANK.find(x=>x.id===g.cur), order=shuffleOpts(it);
  c.innerHTML='<div class="row between"><span class="k">Pregunta '+(g.asked.length+1)+' de '+G_TOTAL+'</span><div class="bar" style="width:160px"><i style="width:'+g.asked.length/G_TOTAL*100+'%"></i></div></div>'+
   '<p class="q">'+esc(it.q)+'</p><div class="opts">'+order.map(i=>'<button class="opt" data-i="'+i+'">'+esc(it.o[i])+'</button>').join("")+'</div><p class="tiny muted" style="margin-top:14px">Si no sabes, elige la que te parezca más natural: el test se adapta.</p>';
  c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{

    g.asked.push({id:it.id,l:it.l,ok,ch:it.o[ch]});
    if(!ok) addError({skill:"grammar",kind:"grammar",prompt:it.q,wrong:it.o[ch],correct:it.o[it.a],explanation:it.x});
    g.idx=clamp(g.idx+(ok?1:-1),0,5); g.cur=null; save(); dGrammar(c);
  });
}
function grammarLevel(){

  const by=[0,1,2,3,4,5].map(L=>{const xs=a.filter(x=>x.l===L);return {n:xs.length,ok:xs.filter(x=>x.ok).length};});
  let lvl=-1; for(let L=0;L<6;L++){ if(by[L].n&&by[L].ok/by[L].n>=0.6) lvl=L; else if(by[L].n&&by[L].ok/by[L].n<0.5&&lvl>=L-1) break; }
  return {level:LEVELS[Math.max(0,lvl)],by,correct:a.filter(x=>x.ok).length,total:a.length};
}

function addError(e){
  const key=norm(e.correct)+"|"+norm(e.wrong);
  const ex=S.errors.find(x=>x.key===key);
  if(ex){ex.count++;ex.last=nowISO();ex.resolved=false;ex.streak=0;return;}
  S.errors.unshift(Object.assign({id:uid(),key,count:1,first:nowISO(),last:nowISO(),resolved:false,streak:0},e));
  S.errors=S.errors.slice(0,300);
}
function addCard(term,meaning,example,source){
  if(!term) return; const k=norm(term);
  if(S.vocab.some(c=>norm(c.term)===k)) return;
  S.vocab.push({id:uid(),term,meaning:meaning||"",example:example||"",source:source||"",ef:2.5,int:0,reps:0,lapses:0,due:today(),added:today()});
}
function srs(card,q){ // SM-2 simplificado; q: 0 otra vez, 3 difícil, 4 bien, 5 fácil
  if(q<3){card.reps=0;card.int=1;card.lapses++;}
  else{card.reps++;card.int=card.reps===1?1:card.reps===2?3:Math.round(card.int*card.ef*(q===3?0.8:q===5?1.3:1));}
  card.ef=Math.max(1.3,card.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));
  const d=new Date();d.setDate(d.getDate()+card.int);card.due=d.toISOString().slice(0,10);card.last=today();
}
const cardStatus=c=>c.reps===0?"nueva":c.int>=21?"dominada":"en aprendizaje";

async function generateCourse(){
  const r=S.diag.result;
  const res=await askJSON("You are an expert instructional designer for adult English learners (SLA, spaced repetition, retrieval practice). "+LEARNER+"\nDiagnostic report: "+JSON.stringify(r)+"\nDesign a 6-month adaptive program: exactly 6 modules (one per month), each with 3 units, each unit with 3 lessons; the LAST lesson of each module's last unit must be a module assessment (skill \"assessment\"). Prioritize the weaknesses. Cover speaking, listening, grammar, vocabulary, reading_writing, mixing professional and everyday/travel/social/cultural topics. Progress the CEFR target gradually from the current level. Lesson titles in English, short; objectives in Spanish (max 14 words). Return ONLY JSON: {\"title\":\"...\",\"summary_es\":\"2 sentences\",\"modules\":[{\"title\":\"...\",\"target\":\"B1+\",\"focus_es\":\"...\",\"units\":[{\"title\":\"...\",\"lessons\":[{\"title\":\"...\",\"skill\":\"speaking|listening|grammar|vocabulary|reading_writing|assessment\",\"objective\":\"...\"}]}]}]}","complex");
  if(!res||!Array.isArray(res.modules)||!res.modules.length) throw {message:"Respuesta inválida"};
  res.modules.forEach((m,mi)=>{m.id="m"+(mi+1);m.units=(m.units||[]).slice(0,4);m.units.forEach((u,ui)=>{u.id=m.id+"u"+(ui+1);u.lessons=(u.lessons||[]).slice(0,5);u.lessons.forEach((l,li)=>{l.id=u.id+"l"+(li+1);l.status="locked";l.attempts=0;l.best=null;});});});
  res.modules[0].units[0].lessons[0].status="available";
  res.generatedAt=nowISO(); res.basedOn=r.global;
  return res;
}

function itemsUI(c,items,store,prefix,onDone,doneLabel){

  const finish=(given,ok)=>{

    store[idx]={given,ok}; const correct=it.type==="fill"?it.answer:(it.options||it.o)[it.answer];
    if(!ok) addError({skill:S.current&&lessonById(S.current.lessonId)?lessonById(S.current.lessonId).l.skill:"grammar",kind:"grammar",prompt:it.prompt||it.q,wrong:given,correct,explanation:it.explanation_es||""});

    $("#nx").onclick=()=>itemsUI(c,items,store,prefix,onDone,doneLabel); $("#nx").focus();
  };
  if(it.type==="fill"){const fi=$("#fi");fi.focus();const ck=()=>{const v=fi.value.trim();if(!v)return;const acc=[it.answer].concat(it.accept||[]).map(norm);fi.disabled=true;$("#ck").remove();finish(v,acc.includes(norm(v)));};$("#ck").onclick=ck;fi.onkeydown=e=>{if(e.key==="Enter")ck();};
    if($("#fmic")){const ta=document.createElement("textarea");ta.hidden=true;c.appendChild(ta);$("#fmic").onclick=()=>{ta.value="";startDictation(ta,$("#fmic"));};ta.addEventListener("input",()=>{if(dictState.on||ta.dataset.voice!=="1")return;ta.dataset.voice="";fi.value=ta.value.trim().replace(/[.?!]$/,"");fi.focus();});}}
  else c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ch=+b.dataset.i,ok=ch===it.answer;c.querySelectorAll(".opt").forEach(z=>{z.disabled=true;if(+z.dataset.i===it.answer)z.classList.add("right");});if(!ok)b.classList.add("wrong");finish((it.options||it.o)[ch],ok);});

function lessonScore(){
  const cur=S.current, a=Object.values(cur.answers||{}), f=Object.values(cur.final||{}), au=Object.values(cur.audioAns||{});
  if(cur.audioSum&&cur.audioSum.eval&&cur.audioSum.eval.scores&&!cur.audioSum.logged){cur.audioSum.logged=true;const sc=cur.audioSum.eval.scores;S.results.push({date:nowISO(),type:"lesson-part",skill:"listening",score:sc.comprehension!=null?sc.comprehension:Object.values(sc)[0],title:"Resumen oral del audio"});}
  const items=a.concat(f,au); const acc=items.length?items.filter(z=>z.ok).length/items.length*100:0;
  const finalAcc=f.length?f.filter(z=>z.ok).length/f.length*100:acc;
  const ev=cur.app&&cur.app.eval; const appSc=ev&&ev.scores?Object.values(ev.scores).reduce((s,v)=>s+v,0)/Object.values(ev.scores).length:null;
  const score=appSc==null?acc:acc*0.8+appSc*0.2;
  const passed=acc>=80&&finalAcc>=75&&(appSc==null||appSc>=60);
  return {score,acc,finalAcc,appSc,passed};
}
function lDone(c,x){

  let i=0, flipped=false;
  const show=()=>{const c=due[i]; if(!c){vc.innerHTML='<div class="empty">Sesión terminada: repasaste '+due.length+' tarjetas.</div>';return;}
    vc.innerHTML='<div class="row between"><span class="k">Tarjeta '+(i+1)+' de '+due.length+'</span>'+(tts?'<button class="btn ghost" id="say">'+ICON.speaker+' Escuchar</button>':'')+'</div><div class="flash"><div class="face"><div><div class="term">'+esc(c.term)+'</div>'+(flipped?'<p style="margin-top:14px;font-size:17px">'+esc(c.meaning)+'</p>'+(c.example?'<p class="muted small" style="margin-top:8px"><i>'+esc(c.example)+'</i></p>':''):'<p class="muted small" style="margin-top:14px">¿Recuerdas qué significa y cómo usarla?</p>')+'</div></div></div>'+
    '<div class="row" style="justify-content:center;margin-top:8px">'+(flipped?[[0,"Otra vez","bad"],[3,"Difícil",""],[4,"Bien",""],[5,"Fácil","ok"]].map(g=>'<button class="btn '+(g[2]==="ok"?"ok":"")+'" data-q="'+g[0]+'">'+g[1]+'</button>').join(""):'<button class="btn pri" id="fl">Mostrar respuesta</button>')+'</div>';
    if($("#say"))$("#say").onclick=()=>speak(c.term+(c.example?". "+c.example:"")).catch(()=>{});
    if($("#fl"))$("#fl").onclick=()=>{flipped=true;show();};
    vc.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{srs(c,+b.dataset.q);S.results.push({date:nowISO(),type:"vocab",skill:"vocabulary",score:+b.dataset.q>=4?100:+b.dataset.q===3?70:0,title:"Repaso: "+c.term});if(S.results.length>1500)S.results=S.results.filter(r=>r.type!=="vocab").concat(S.results.filter(r=>r.type==="vocab").slice(-600));save();i++;flipped=false;show();});
  };
  show();
}

/* ============================================================
   REVIEW CENTER
   ============================================================ */
function vReview(m){
  const open=S.errors.filter(e=>!e.resolved).sort((a,b)=>b.count-a.count||b.last.localeCompare(a.last));
  const byKind={grammar:0,naturalness:0,vocab:0};open.forEach(e=>byKind[e.kind]=(byKind[e.kind]||0)+1);
  m.innerHTML=header("Review Center","Tus errores más frecuentes, reunidos automáticamente. Corrige cada uno 2 veces seguidas para darlo por superado.")+
   '<div class="grid g3" style="margin-bottom:16px">'+stat("Errores gramaticales",byKind.grammar,"pendientes")+stat("Expresiones poco naturales",byKind.naturalness,"pendientes")+stat("Vocabulario / comprensión",byKind.vocab,"pendientes")+'</div>'+
   '<div class="card" id="rc"></div>'+
   '<div class="card" style="margin-top:16px"><h3>Errores registrados</h3>'+(open.length?'<table style="margin-top:8px"><tr><th>Tipo</th><th>Lo que pusiste</th><th>Forma correcta</th><th>Veces</th></tr>'+open.slice(0,40).map(e=>'<tr><td><span class="tag '+(e.kind==="grammar"?"g":e.kind==="naturalness"?"n":"v")+'">'+(e.kind==="grammar"?"Gramática":e.kind==="naturalness"?"Natural":"Vocab")+'</span></td><td class="small">'+esc(e.wrong)+'</td><td class="small"><b>'+esc(e.correct)+'</b><div class="tiny muted">'+esc(e.explanation||"")+'</div></td><td>'+e.count+'</td></tr>').join("")+'</table>':'<p class="muted small" style="margin-top:8px">Sin errores pendientes.</p>')+'</div>';
  const rc=$("#rc");
  if(!open.length){rc.innerHTML='<div class="empty">No tienes errores pendientes. Sigue con tus lecciones.</div>';return;}
  rc.innerHTML='<h3>Práctica dirigida</h3><p class="small muted" style="margin:6px 0 14px">Elige el tipo de práctica.</p><div class="row"><button class="btn pri" id="fx">Corregir mis propias frases ('+Math.min(8,open.length)+')</button>'+(sample?'<button class="btn" id="gn">Ejercicios nuevos con IA sobre estos errores</button>':'')+'</div>';
  $("#fx").onclick=()=>fixDrill(rc,open.slice(0,8),0,0);
  if($("#gn"))$("#gn").onclick=async()=>{rc.innerHTML='<div class="empty"><span class="spin"></span> Creando ejercicios dirigidos…</div>';
    try{const r=await askJSON("You are an English teacher. "+LEARNER+"\nThe learner's recurring errors: "+JSON.stringify(open.slice(0,8).map(e=>({wrong:e.wrong,correct:e.correct,kind:e.kind,why:e.explanation})))+"\nCreate 8 NEW targeted exercises (new sentences, same underlying problems). Return ONLY JSON: {\"items\":[{\"type\":\"mc\",\"prompt\":\"...\",\"options\":[4],\"answer\":idx,\"explanation_es\":\"...\"} or {\"type\":\"fill\",\"prompt\":\"... ___ ...\",\"answer\":\"...\",\"accept\":[],\"explanation_es\":\"...\"}]}");
      const store={}; itemsUI(rc,r.items||[],store,"Ejercicio de repaso",()=>{const v=Object.values(store),sc=v.filter(z=>z.ok).length/(v.length||1)*100;S.results.push({date:nowISO(),type:"review",skill:"grammar",score:sc,title:"Repaso dirigido"});save();rc.innerHTML='<div class="empty"><div class="lvl">'+Math.round(sc)+'%</div><p style="margin-top:8px">Repaso terminado.</p></div>';},"Terminar");}
    catch(e){toast(e.message||"Error");vReview(m);}};
}
function fixDrill(rc,list,i,okN){
  const e=list[i];
  if(!e){S.results.push({date:nowISO(),type:"review",skill:"grammar",score:okN/list.length*100,title:"Corrección de errores"});save();rc.innerHTML='<div class="empty"><div class="lvl">'+okN+'/'+list.length+'</div><p style="margin-top:8px">Corregiste '+okN+' de '+list.length+'.</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn pri" id="bk">Volver</button></div></div>';$("#bk").onclick=()=>render();return;}
  const isQ=!/^Corrige:/.test(e.prompt||"");
  rc.innerHTML='<div class="row between"><span class="k">Error '+(i+1)+' de '+list.length+' · cometido '+e.count+' '+(e.count>1?"veces":"vez")+'</span></div>'+
   (isQ?'<p class="q">'+esc(e.prompt)+'</p><p class="small muted">Escribe la respuesta correcta.</p>':'<p class="small muted" style="margin-top:8px">Reescribe esta frase de forma correcta y natural:</p><p class="q">'+esc(e.wrong)+'</p>')+
   '<input type="text" id="fi" autocomplete="off"><div class="row" style="margin-top:12px"><button class="btn pri" id="ck">Comprobar</button></div><div id="fb"></div>';
  const fi=$("#fi");fi.focus();
  const ck=()=>{const v=fi.value.trim();if(!v)return;const ok=norm(v)===norm(e.correct);fi.disabled=true;$("#ck").remove();
    const done=ok2=>{ if(ok2){e.streak=(e.streak||0)+1;if(e.streak>=2)e.resolved=true;} else {e.streak=0;} save(); };
    $("#fb").innerHTML='<div class="fb '+(ok?"ok":"bad")+'"><b>'+(ok?"¡Correcto!":"Forma recomendada:")+'</b> '+esc(e.correct)+'<div class="small" style="margin-top:4px">'+esc(e.explanation||"")+'</div></div><div class="row" style="margin-top:12px">'+(ok?'':'<button class="btn" id="mine">Mi respuesta también era correcta</button>')+'<button class="btn pri" id="nx">Siguiente</button></div>';
    let counted=ok; done(ok);
    if($("#mine"))$("#mine").onclick=()=>{e.streak=(e.streak||0)+1;if(e.streak>=2)e.resolved=true;counted=true;save();$("#mine").remove();};
    $("#nx").onclick=()=>fixDrill(rc,list,i+1,okN+(counted?1:0));};
  $("#ck").onclick=ck; fi.onkeydown=ev=>{if(ev.key==="Enter")ck();};
}

/* ============================================================
   PROGRESS ANALYTICS
   ============================================================ */
function vAnalytics(m){
  const colors={grammar:"#3b5bdb",vocabulary:"#22b8cf",reading_writing:"#12a36b",writing:"#12a36b",listening:"#e8890c",speaking:"#d6334a",assessment:"#7048e8"};
  const rs=S.results.filter(r=>r.type!=="vocab"&&r.type!=="diagnostic");
  // evolución por competencia (por semana)
  const weeks=[...new Set(rs.map(r=>weekStart(r.date)))].sort().slice(-12);
  const skills=["grammar","vocabulary","reading_writing","listening","speaking","assessment"].filter(k=>rs.some(r=>r.skill===k));
  const series=skills.map(k=>({name:SKILL_LABEL[k],color:colors[k],pts:weeks.map(w=>{const xs=rs.filter(r=>r.skill===k&&weekStart(r.date)===w);return xs.length?xs.reduce((a,r)=>a+r.score,0)/xs.length:null;})}));
  // minutos por día (14 días)
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10));}
  // dominio por módulo
  const mods=S.course?S.course.modules.map((md,i)=>{const ls=md.units.flatMap(u=>u.lessons);return {k:"Mes "+(i+1)+": "+md.title,v:ls.filter(l=>l.status==="done").length/ls.length*100};}):[];
  // errores frecuentes
  const errs=S.errors.slice().sort((a,b)=>b.count-a.count).slice(0,8).map(e=>({k:e.correct,v:e.count,c:e.resolved?"#9aa3b8":"#d6334a"}));
  // vocabulario
  const vc={nueva:0,"en aprendizaje":0,dominada:0};S.vocab.forEach(c=>vc[cardStatus(c)]++);
  const tests=S.results.filter(r=>r.type==="diagnostic"||r.skill==="assessment"||r.type==="speaking").slice(-15).reverse();
  m.innerHTML=header("Progress Analytics","Tu evolución con datos reales registrados en la app.")+
   '<div class="grid g2"><div class="card"><h3>Evolución por competencia (promedio semanal)</h3>'+(weeks.length>=2?lineChart(series,weeks.map(w=>w.slice(5)),100):'<p class="muted small" style="margin-top:10px">Se necesitan al menos 2 semanas con actividad.'+(weeks.length?' Esta semana: '+series.map(s=>s.name+" "+Math.round(s.pts[0]||0)+"%").join(", "):'')+'</p>')+'</div>'+
   '<div class="card"><h3>Tiempo de estudio (últimos 14 días)</h3>'+barChart(days.map(d=>({k:new Date(d+"T12:00:00").toLocaleDateString("es-CL",{weekday:"short",day:"numeric"}),v:S.time.byDay[d]||0})),Math.max(30,...days.map(d=>S.time.byDay[d]||0))," min","#22b8cf")+'</div>'+
   '<div class="card"><h3>Porcentaje de dominio por módulo</h3>'+barChart(mods,100,"%","#12a36b")+'</div>'+
   '<div class="card"><h3>Errores más frecuentes</h3>'+barChart(errs,Math.max(1,...errs.map(e=>e.v)),"×")+'<p class="tiny muted">En gris: ya superados.</p></div>'+
   '<div class="card"><h3>Vocabulario</h3>'+barChart([{k:"Dominadas",v:vc.dominada,c:"#12a36b"},{k:"En aprendizaje",v:vc["en aprendizaje"],c:"#3b5bdb"},{k:"Nuevas",v:vc.nueva,c:"#9aa3b8"}],Math.max(1,S.vocab.length))+'</div>'+
   '<div class="card"><h3>Resultados de evaluaciones</h3>'+(tests.length?'<table style="margin-top:8px"><tr><th>Evaluación</th><th>Resultado</th></tr>'+tests.map(r=>'<tr><td>'+esc(r.title)+'<div class="tiny muted">'+new Date(r.date).toLocaleDateString("es-CL")+'</div></td><td><b>'+(r.type==="diagnostic"?esc((r.title.split("·")[1]||"").trim()):Math.round(r.score)+"%")+'</b></td></tr>').join("")+'</table>':'<p class="muted small">Sin evaluaciones aún.</p>')+'</div></div>';
}

/* ============================================================
   AJUSTES Y RESPALDO
   ============================================================ */
function vSettings(m){
  m.innerHTML=header("Ajustes y respaldo","")+
   '<div class="grid g2">'+EC.keyCard()+'<div class="card"><h3>Dónde se guarda tu progreso</h3><p class="small" style="margin-top:8px">'+
   (persistMode==="account"?'<span class="pill ok">Cuenta</span> Tu progreso se guarda automáticamente en la base de datos privada de esta app, asociada a tu cuenta de Claude. Solo tú puedes verlo. Además queda una copia en este navegador.':
    '<span class="pill ok">Este computador</span> Tu progreso se guarda automáticamente dentro de la app, en este computador. Exporta un respaldo de vez en cuando: te sirve para pasarlo a otro equipo o si borras los datos del navegador.')+
   '</p><p class="small muted" style="margin-top:8px">Última actualización: '+new Date(S.updatedAt).toLocaleString("es-CL")+'</p></div>'+
   '<div class="card"><h3>Respaldo (JSON)</h3><p class="small muted" style="margin:8px 0 12px">Descarga todo tu progreso o restáuralo desde un archivo.</p><div class="row"><button class="btn pri" id="exp">Exportar progreso</button><button class="btn" id="imp">Importar respaldo</button></div><textarea id="expt" style="display:none;margin-top:12px;min-height:120px" readonly></textarea></div>'+
   '<div class="card"><h3>Objetivos semanales</h3><div class="grid g2" style="margin-top:10px"><label class="small">Minutos por semana<input type="number" id="gm" min="10" max="2000" value="'+S.prefs.goalMin+'"></label><label class="small">Lecciones por semana<input type="number" id="gl" min="1" max="30" value="'+S.prefs.goalLessons+'"></label></div><div class="row" style="margin-top:10px"><button class="btn" id="sg">Guardar objetivos</button></div></div>'+
   '<div class="card"><h3>Audio</h3>'+(tts?'<div class="grid g2" style="margin-top:10px"><label class="small">Voz<select id="vv">'+EC.voiceOptions(S.prefs.voice)+'</select></label><label class="small">Velocidad<select id="vr">'+[0.8,0.9,1,1.1,1.2].map(v=>'<option value="'+v+'" '+(S.prefs.rate==v?"selected":"")+'>'+v+'×</option>').join("")+'</select></label></div><div class="row" style="margin-top:10px"><button class="btn" id="tv">'+ICON.speaker+' Probar</button></div>':'<p class="small muted" style="margin-top:8px">El audio no está disponible en este navegador o app.</p>')+'</div>'+
   '<div class="card"><h3>Probar micrófono</h3>'+(dict?'<p class="small muted" style="margin:8px 0 10px">Pulsa «Hablar», di una frase en inglés y pulsa «Detener». Si aparece el texto, el reconocimiento de voz funciona.</p><textarea id="mt" style="min-height:70px" placeholder="Aquí aparecerá lo que digas…"></textarea><div class="row" style="margin-top:10px"><button class="btn" id="mtb">'+ICON.mic+' Hablar</button></div>':micNote())+'</div>'+
   '<div class="card"><h3>Capacidades disponibles en esta vista</h3><ul class="small" style="margin:8px 0 0;padding-left:18px;display:grid;gap:4px">'+
    cap("Guardado en este computador",true)+cap("Corrección y lecciones con IA (Gemini)",!!sample)+cap("Audio en inglés (listening)",!!tts)+cap("Reconocimiento de voz (speaking y respuestas habladas)",!!dict)+cap("Descarga de archivos",!!dls)+'</ul></div>'+
   '<div class="card"><h3>Reiniciar</h3><p class="small muted" style="margin:8px 0 12px">Puedes repetir el diagnóstico (se conserva tu historial) o borrar todo.</p><div class="row"><button class="btn" id="rd">Repetir diagnóstico</button><button class="btn" id="rs" style="color:var(--bad)">Borrar todo</button></div></div></div>';
  EC.wireKeyCard(m,()=>{sample=EC.makeSample();vSettings(m);});
  $("#exp").onclick=async()=>{const data=JSON.stringify(S,null,1),fn="english-coach-progreso-"+today()+".json";
    if(dls){try{await dls.save({filename:fn,data});toast("Respaldo descargado");return;}catch(e){}}
    const t=$("#expt");t.style.display="block";t.value=data;t.select();toast("Copia este texto y guárdalo como archivo .json");};
  $("#imp").onclick=()=>$("#importFile").click();
  if($("#mtb")) $("#mtb").onclick=()=>startDictation($("#mt"),$("#mtb"));
  $("#sg").onclick=()=>{S.prefs.goalMin=clamp(+$("#gm").value||150,10,2000);S.prefs.goalLessons=clamp(+$("#gl").value||3,1,30);save();toast("Objetivos guardados");};
  if($("#vv")){$("#vv").onchange=e=>{S.prefs.voice=e.target.value;save();};$("#vr").onchange=e=>{S.prefs.rate=+e.target.value;save();};$("#tv").onclick=()=>speak("Hi! This is how your listening exercises will sound.").catch(()=>toast("No se pudo reproducir"));}
  $("#rd").onclick=()=>{ if(!$("#rd").dataset.c){$("#rd").dataset.c=1;$("#rd").textContent="Pulsa otra vez para confirmar";return;}
    S.diag={status:"none",step:"intro",previous:S.diag.result||null};save();go("diagnostic");};
  $("#rs").onclick=()=>{ if(!$("#rs").dataset.c){$("#rs").dataset.c=1;$("#rs").textContent="Pulsa otra vez: se borra TODO";return;}
    S=blankState();save();flush();go("dashboard");};
}
function cap(t,ok){return '<li>'+(ok?'<span style="color:var(--ok)">✓</span> ':'<span style="color:var(--bad)">✗</span> ')+t+'</li>';}
$("#importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.diag||!o.prefs)throw 0;S=migrate(o);S.updatedAt=nowISO();save();flush();toast("Progreso restaurado");go("dashboard");}catch(_){toast("El archivo no es un respaldo válido de English Coach");}};r.readAsText(f);e.target.value="";};

/* ============================================================
   ARRANQUE
   ============================================================ */
async function boot(){
  const local=loadLocal(); if(local) S=migrate(local);
  render();
  sample=EC.makeSample(); tts=EC.makeTTS(); dict=EC.makeDict(); dls=EC.makeDls();
  wireDictation(); persistMode="local"; setSaveStatus("ok","Progreso guardado en este computador");
  render(); EC.afterBoot(); return;
  db=await use("db"); userCap=await use("user");
  if(db&&userCap){ try{me=await userCap.id();}catch(e){me=null;} }
  if(db&&me){
    setSaveStatus("warn","Cargando tu progreso…");
    const timer=setTimeout(()=>setSaveStatus("warn","No se pudo contactar la base de datos aún…"),10000);
    try{
      const snap=await db.doc("data/users/"+me+"/state").get(); clearTimeout(timer);
      persistMode="account";
      if(snap.exists){ const remote=migrate(snap.data()?JSON.parse(JSON.stringify(snap.data())):null);
        if(!local||!local.updatedAt||remote.updatedAt>=local.updatedAt){S=remote;lastSaved=JSON.stringify(S);saveLocal(lastSaved);setSaveStatus("ok","Progreso guardado en tu cuenta");}
        else { save(); }
      } else { if(local) save(); else setSaveStatus("ok","Listo para guardar en tu cuenta"); }
    }catch(e){clearTimeout(timer);persistMode="local";setSaveStatus("warn","Base de datos no disponible: guardado local");}
  } else { persistMode="local"; setSaveStatus("warn","Guardado solo en este navegador"); }
  render();
}
boot();
})();
</script>
